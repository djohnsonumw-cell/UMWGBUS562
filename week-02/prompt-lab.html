<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Lab</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-2: #f0eee8;
    --text: #1f2328;
    --muted: #6a6f78;
    --line: #e2dfd7;
    --accent: #c4613a;
    --accent-text: #ffffff;
    --system: #5b6b8c;
    --system-bg: #eef1f7;
    --user: #1f6f5c;
    --user-bg: #e9f4f0;
    --claude: #c4613a;
    --claude-bg: #fbf0ea;
    --error: #b42318;
    --error-bg: #fdecea;
    --focus: #2f6fdb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b;
      --surface: #1d2025;
      --surface-2: #262a30;
      --text: #e7e9ec;
      --muted: #9aa1ab;
      --line: #30353d;
      --accent: #e07a52;
      --accent-text: #1a1a1a;
      --system: #a8b6d6;
      --system-bg: #232a38;
      --user: #7fd1b9;
      --user-bg: #1d2e29;
      --claude: #f0a07f;
      --claude-bg: #33241d;
      --error: #ff8a80;
      --error-bg: #3a1f1d;
      --focus: #7aa7ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171b;
    --surface: #1d2025;
    --surface-2: #262a30;
    --text: #e7e9ec;
    --muted: #9aa1ab;
    --line: #30353d;
    --accent: #e07a52;
    --accent-text: #1a1a1a;
    --system: #a8b6d6;
    --system-bg: #232a38;
    --user: #7fd1b9;
    --user-bg: #1d2e29;
    --claude: #f0a07f;
    --claude-bg: #33241d;
    --error: #ff8a80;
    --error-bg: #3a1f1d;
    --focus: #7aa7ff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .app {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  .model {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 13px;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .settings { display: grid; gap: 14px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  label .opt { font-weight: 400; color: var(--muted); }
  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .help { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }

  /* Conversation log */
  .log-card { padding: 0; display: flex; flex-direction: column; }
  .log-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  .log-head h2 { margin: 0; font-size: 14px; }
  .log-head .count { font-size: 12.5px; color: var(--muted); }
  .log {
    height: 52vh;
    min-height: 260px;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 380px;
  }
  .msg {
    border-radius: 12px;
    padding: 10px 14px;
    border-left: 4px solid;
  }
  .msg .who {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .msg .who .note { text-transform: none; letter-spacing: 0; font-weight: 500; opacity: .85; }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.system { background: var(--system-bg); border-color: var(--system); }
  .msg.system .who { color: var(--system); }
  .msg.user { background: var(--user-bg); border-color: var(--user); }
  .msg.user .who { color: var(--user); }
  .msg.assistant { background: var(--claude-bg); border-color: var(--claude); }
  .msg.assistant .who { color: var(--claude); }
  .msg.error { background: var(--error-bg); border-color: var(--error); }
  .msg.error .who { color: var(--error); }
  .msg.failed { opacity: .6; }
  .msg .meta { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .waiting .body { color: var(--muted); }
  .waiting .body::after {
    content: "";
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }

  /* Composer */
  .composer { display: grid; gap: 10px; }
  .composer textarea { min-height: 90px; }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .row .hint { font-size: 12.5px; color: var(--muted); }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit;
    font-weight: 600;
    border-radius: 10px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }
  button:hover:not(:disabled) { background: var(--surface-2); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    .waiting .body::after { animation: none; content: "..."; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Prompt Lab</h1>
    <span class="model" id="model-name"></span>
  </header>

  <section class="card settings" aria-label="Settings">
    <div>
      <label for="api-key">Anthropic API key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">
      <p class="help">Paste your key each time you open the page. It stays in this tab's memory only. It's never saved and is sent only to api.anthropic.com.</p>
    </div>
    <div>
      <label for="system">System prompt <span class="opt">(optional)</span></label>
      <textarea id="system" rows="3" placeholder="e.g. You are a concise tutor for a business school course."></textarea>
    </div>
  </section>

  <section class="card log-card" aria-label="Conversation">
    <div class="log-head">
      <h2>Conversation</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
  </section>

  <section class="card composer" aria-label="New prompt">
    <label for="prompt" style="margin:0">Prompt</label>
    <textarea id="prompt" rows="4" placeholder="Type a prompt for Claude..."></textarea>
    <div class="row">
      <span class="hint">Ctrl + Enter to send</span>
      <div class="buttons">
        <button type="button" id="new">New Conversation</button>
        <button type="button" id="export">Export</button>
        <button type="button" class="primary" id="send">Send</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  const MODEL = 'claude-sonnet-5';
  const API_URL = 'https://api.anthropic.com/v1/messages';
  const MAX_TOKENS = 16000;

  const $ = s => document.querySelector(s);
  const keyEl = $('#api-key'), systemEl = $('#system'), promptEl = $('#prompt');
  const logEl = $('#log'), countEl = $('#count');
  const sendBtn = $('#send'), newBtn = $('#new'), exportBtn = $('#export');

  // `messages` is exactly what goes to the API (minus the system prompt).
  // `entries` is everything shown in the log, in order.
  let messages = [];
  let entries = [];
  let sentSystem = null;   // system prompt in effect for the conversation so far; null = nothing sent yet
  let waiting = false;

  $('#model-name').textContent = MODEL;

  function render() {
    logEl.replaceChildren();
    if (!entries.length && !waiting) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'No messages yet. Write a prompt below and press Send. Each prompt goes to Claude together with the whole conversation so far.';
      logEl.append(empty);
    }
    for (const e of entries) logEl.append(entryEl(e));
    if (waiting) {
      logEl.append(entryEl({ kind: 'assistant', text: 'Waiting for Claude', waiting: true }));
    }
    logEl.scrollTop = logEl.scrollHeight;

    const turns = messages.length;
    countEl.textContent = turns ? `${turns} message${turns === 1 ? '' : 's'} sent to Claude each turn` : '';
    sendBtn.disabled = waiting;
    sendBtn.textContent = waiting ? 'Sending...' : 'Send';
    exportBtn.disabled = !entries.some(e => e.kind !== 'error');
  }

  const LABELS = { system: 'System', user: 'You', assistant: 'Claude', error: 'Error' };

  function entryEl(e) {
    const div = document.createElement('div');
    div.className = `msg ${e.kind}` + (e.failed ? ' failed' : '') + (e.waiting ? ' waiting' : '');
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = LABELS[e.kind];
    if (e.note) {
      const note = document.createElement('span');
      note.className = 'note';
      note.textContent = ` · ${e.note}`;
      who.append(note);
    }
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = e.text;
    div.append(who, body);
    if (e.meta) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = e.meta;
      div.append(meta);
    }
    return div;
  }

  // Log the system prompt when it first applies, and whenever it changes mid-conversation.
  function noteSystemPrompt(system) {
    if (system === sentSystem) return;
    if (sentSystem === null) {
      if (system) entries.push({ kind: 'system', role: 'system', text: system });
    } else if (system) {
      entries.push({
        kind: 'system', role: 'system', text: system,
        note: 'changed mid-conversation; this replaces the old system prompt for the whole conversation from this request on'
      });
    } else {
      entries.push({
        kind: 'system', role: 'system', text: '(no system prompt)',
        note: 'removed mid-conversation; requests from here on have no system prompt'
      });
    }
  }

  async function send() {
    if (waiting) return;
    const key = keyEl.value.trim();
    const prompt = promptEl.value;
    if (!key) { keyEl.focus(); flashError('Paste your Anthropic API key first.'); return; }
    if (!prompt.trim()) { promptEl.focus(); return; }

    const system = systemEl.value.trim();
    const previousSystem = sentSystem;
    const entryCount = entries.length;
    noteSystemPrompt(system);
    const systemEntry = entries.length > entryCount ? entries[entryCount] : null;
    sentSystem = system;

    const userEntry = { kind: 'user', role: 'user', text: prompt };
    entries.push(userEntry);
    messages.push({ role: 'user', content: prompt });
    promptEl.value = '';
    waiting = true;
    render();

    const body = { model: MODEL, max_tokens: MAX_TOKENS, messages };
    if (system) body.system = system;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2026-10-21',
          // Required for calling the API straight from a web page.
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const msg = data?.error?.message || res.statusText || 'Request failed';
        throw new Error(`HTTP ${res.status}${data?.error?.type ? ` (${data.error.type})` : ''}: ${msg}`);
      }

      // Replies can include thinking blocks; only the text blocks are Claude's answer.
      const text = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('');
      const notes = [];
      if (data.stop_reason === 'max_tokens') notes.push(`reply cut off at the ${MAX_TOKENS}-token limit`);
      if (data.stop_reason === 'refusal') notes.push('Claude declined to answer this request');
      if (data.usage) notes.push(`${data.usage.input_tokens} tokens in · ${data.usage.output_tokens} tokens out`);

      if (data.stop_reason === 'refusal' && !text) {
        throw new Error('Claude declined to answer this request (stop reason: refusal).');
      }
      messages.push({ role: 'assistant', content: text });
      entries.push({ kind: 'assistant', role: 'assistant', text: text || '(empty reply)', meta: notes.join(' · ') });
    } catch (err) {
      // Take the failed prompt back out so the conversation Claude sees stays valid.
      messages.pop();
      sentSystem = previousSystem;
      if (systemEntry) entries.splice(entries.indexOf(systemEntry), 1);
      userEntry.failed = true;
      userEntry.note = 'not sent; this prompt is not part of the conversation';
      const network = err instanceof TypeError;
      entries.push({
        kind: 'error',
        text: network
          ? `Could not reach the Anthropic API (${err.message}). Check your internet connection.`
          : err.message
      });
      if (!promptEl.value) promptEl.value = prompt;   // put it back so you can retry
    } finally {
      waiting = false;
      render();
      promptEl.focus();
    }
  }

  function flashError(text) {
    entries.push({ kind: 'error', text });
    render();
  }

  function newConversation() {
    if (waiting) return;
    messages = [];
    entries = [];
    sentSystem = null;
    render();
    promptEl.focus();
  }

  function exportMarkdown() {
    const parts = [`Model: ${MODEL}`];
    for (const e of entries) {
      if (e.kind === 'error' || e.failed) continue;
      let text = e.text;
      if (e.kind === 'system' && e.note) text = `_(System prompt ${e.note})_\n\n${text}`;
      parts.push(`### ${LABELS[e.kind]}\n\n${text}`);
    }
    const blob = new Blob([parts.join('\n\n') + '\n'], { type: 'text/markdown' });
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `prompt-lab-${stamp}.md`;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  sendBtn.addEventListener('click', send);
  newBtn.addEventListener('click', newConversation);
  exportBtn.addEventListener('click', exportMarkdown);
  promptEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      send();
    }
  });

  render();
})();
</script>
</body>
</html>
